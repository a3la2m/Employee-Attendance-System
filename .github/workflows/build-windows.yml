name: Build Windows App

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app (.msi / .exe)
        shell: bash
        env:
          # حصرية التوازي لتقليل ذروة الذاكرة على عدّاء GitHub (يُنتج windows-sys الضخم)
          CARGO_BUILD_JOBS: 2
        run: |
          set -o pipefail
          npx tauri build 2>&1 | tee build.log

      - name: Surface build errors
        if: failure()
        shell: bash
        run: |
          set +e
          set +o pipefail
          # cargo يكتب التقدّم ب\r — نحوّله لسطور وننظّف ANSI
          tr '\r' '\n' < build.log | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' > build_clean.log
          grep -v -E "^\s*(Compiling|Checking|Downloaded|Downloading|Updating|Locking|Adding)" build_clean.log > build_signal.log
          echo "lines raw=$(wc -l < build_clean.log) signal=$(wc -l < build_signal.log)"
          {
            echo "## ❌ سجل فشل بناء ويندوز"
            echo '### آخر 60 سطر خام (مكان الوفاة)'
            echo '```'
            tail -n 60 build_clean.log
            echo '```'
            echo '### محتوى بلا ضجيج Compiling'
            echo '```'
            tail -n 150 build_signal.log
            echo '```'
            echo '### الموارد'
            echo '```'
            wmic OS get FreePhysicalMemory,TotalVisibleMemorySize /Value 2>/dev/null | tr -d '\r'
            wmic logicaldisk get Size,FreeSpace,DeviceID /Value 2>/dev/null | tr -d '\r'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # GitHub يقتطع عند 10 annotations لكل خطوة — نضع السجل كاملاً في
          # annotation واحد متعدد الأسطر عبر ترميز %0A فلا يُقتطع.
          emit() { # $1=عنوان $2=ملف
            { echo "::error title=$1::"; tail -n 150 "$2" | sed -e 's/%/%25/g' -e 's/\r$//' | awk '{printf "%s%%0A", $0}'; echo ""; }
          }
          emit "RAW-TAIL-60 (أين مات البناء)" build_clean.log
          emit "NOISE-FILTERED-150" build_signal.log
          grep -n -E "error(\[:]|:)|Error:|FAILED|panicked|No space|memory|Killed|signal" build_clean.log > build_errors.log
          emit "ERROR-MATCHES" build_errors.log
          wc -l build_errors.log
          exit 0

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: attendance-windows-setup
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  test-linux:
    # اختبار المنطق (الرواتب/الحضور) على لينكس لضمان صحته قبل الدمج
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            libxdo-dev build-essential curl wget file pkg-config
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Run payroll/attendance tests
        working-directory: src-tauri
        run: cargo test
