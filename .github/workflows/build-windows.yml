name: Build Windows App

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app (.msi / .exe)
        shell: bash
        env:
          # حصرية التوازي لتقليل ذروة الذاكرة على عدّاء GitHub (يُنتج windows-sys الضخم)
          CARGO_BUILD_JOBS: 2
        run: |
          set -o pipefail
          npx tauri build 2>&1 | tee build.log

      - name: Surface build errors
        if: failure()
        shell: bash
        run: |
          set +e
          set +o pipefail
          # cargo يكتب التقدّم ب\r — نحوّله لسطور وننظّف ANSI
          tr '\r' '\n' < build.log | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' > build_clean.log
          # أزِل ضجيج Compiling/Checking لكشف أي خطأ حقيقي مخفي
          grep -v -E "^\s*(Compiling|Checking|Downloaded|Downloading|Updating|Locking|Adding)" build_clean.log > build_signal.log
          echo "=== عدد سطور السجل الكلي ==="
          wc -l build_clean.log build_signal.log
          echo "=== آخر 60 سطراً (بلا ضجيج Compiling) ==="
          tail -n 60 build_signal.log
          echo "=== تشخيص الموارد ==="
          wmic OS get FreePhysicalMemory,TotalVisibleMemorySize /Value 2>/dev/null | tr -d '\r'
          wmic logicaldisk get Size,FreeSpace,DeviceID /Value 2>/dev/null | tr -d '\r'
          {
            echo "## ❌ سجل فشل بناء ويندوز"
            echo "عدد سطور السجل: $(wc -l < build_clean.log) — بلا ضجيج: $(wc -l < build_signal.log)"
            echo '```'
            tail -n 120 build_signal.log
            echo '```'
            echo "### الموارد (ذاكرة/قرص)"
            echo '```'
            wmic OS get FreePhysicalMemory,TotalVisibleMemorySize /Value 2>/dev/null | tr -d '\r'
            wmic logicaldisk get Size,FreeSpace,DeviceID /Value 2>/dev/null | tr -d '\r'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -n 35 build_signal.log | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line}"
          done
          exit 0

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: attendance-windows-setup
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  test-linux:
    # اختبار المنطق (الرواتب/الحضور) على لينكس لضمان صحته قبل الدمج
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            libxdo-dev build-essential curl wget file pkg-config
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Run payroll/attendance tests
        working-directory: src-tauri
        run: cargo test
