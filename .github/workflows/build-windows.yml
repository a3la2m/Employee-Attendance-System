name: Build Windows App

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app (.msi / .exe)
        run: npx tauri build

      - name: Surface build errors
        if: failure()
        shell: bash
        run: |
          echo "--- آخر 200 سطر من سجل البناء ---"
          LOG="src-tauri/target/release/build.log"
          if [ -f build.log ]; then LOG=build.log; fi
          # إعادة تشغيل البناء لالتقاط السجل إن لم يكن محفوظاً
          if [ ! -f build.log ]; then
            npx tauri build > build.log 2>&1 || true
          fi
          tail -n 200 build.log
          {
            echo "## ❌ تفاصيل فشل بناء ويندوز"
            echo '```'
            grep -E "^error(\[|:)|error: could not compile|panicked" -A 8 build.log | tail -n 120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # إشعارات مباشرة تظهر عبر API للوحدات (annotations)
          grep -E "^error(\[|:)" -A 6 build.log | head -n 100 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: attendance-windows-setup
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  test-linux:
    # اختبار المنطق (الرواتب/الحضور) على لينكس لضمان صحته قبل الدمج
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            libxdo-dev build-essential curl wget file pkg-config
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Run payroll/attendance tests
        working-directory: src-tauri
        run: cargo test
