[package]
name = "employee-attendance-system"
version = "0.3.1"
description = "نظام إدارة الحضور والانصراف والرواتب"
authors = ["you"]
edition = "2021"

[lib]
name = "attendance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# بدون custom-protocol يبني tauri التطبيق في وضع التطوير (devUrl = localhost:1420
# ونافذة فارغة/خاطئة عند التشغيل) — نسخة الإصدار يجب أن تُبنى بهذه الخاصية.
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

# FFI لاستدعاء DLL الخاص بـ SDK جهاز البصمة (يعمل فقط على ويندوز)
[target.'cfg(windows)'.dependencies]
libloading = "0.8"
winreg = "0.55"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
